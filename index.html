<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>情绪盒子 · 与你同在</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(160deg, #f5f0eb 0%, #e8e0d5 30%, #f0e8dc 60%, #faf6f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Quicksand', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
      padding: 1.5rem;
      margin: 0;
    }

    .container {
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* ========== 情绪盒子卡片 ========== */
    .box {
      width: 100%;
      background: rgba(255, 252, 247, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: #fffcf7;
      box-shadow: 0 25px 45px rgba(130, 100, 70, 0.08), 0 8px 20px rgba(100, 70, 40, 0.06);
      border-radius: 2.8rem;
      padding: 2rem 1.5rem 1.5rem;
      border: 1px solid rgba(220, 200, 175, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: all 0.3s ease;
    }

    h1 {
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 2px;
      color: #8b7355;
      margin-bottom: 0.2rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      justify-content: center;
    }
    h1 span {
      font-size: 1.8rem;
    }

    .wife-tag {
      font-size: 0.68rem;
      color: #c4a68a;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      font-weight: 400;
      opacity: 0.75;
    }

    .sub {
      color: #b8a088;
      font-weight: 300;
      margin-bottom: 1.8rem;
      font-size: 0.9rem;
      border-bottom: 1px solid #e5d9c9;
      padding-bottom: 0.8rem;
      width: 75%;
      letter-spacing: 0.5px;
    }

    .emotion-input-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.2rem;
    }

    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: #a08b74;
      font-weight: 500;
    }

    input {
      background: #fefcf8;
      border: 1.5px solid #e0d3c0;
      border-radius: 3rem;
      padding: 0.85rem 1.4rem;
      font-size: 1rem;
      font-family: inherit;
      color: #5a4532;
      outline: none;
      transition: all 0.25s;
      box-shadow: inset 0 2px 5px rgba(160, 130, 100, 0.04);
      text-align: center;
      letter-spacing: 0.3px;
    }

    input:focus {
      border-color: #bfa88b;
      box-shadow: 0 0 0 4px rgba(180, 140, 100, 0.12), inset 0 1px 4px rgba(100, 70, 40, 0.06);
      background: #fffefa;
    }

    input::placeholder {
      color: #c8b8a5;
      font-style: italic;
      font-weight: 300;
    }

    .button-group {
      display: flex;
      gap: 0.6rem;
      width: 100%;
      margin-top: 0.2rem;
      flex-wrap: wrap;
    }

    button {
      background: #efe3d4;
      border: none;
      padding: 0.8rem 1.3rem;
      border-radius: 3rem;
      font-weight: 500;
      font-size: 0.9rem;
      letter-spacing: 0.6px;
      color: #5a4330;
      cursor: pointer;
      transition: 0.25s ease;
      flex: 1 1 auto;
      min-width: 80px;
      box-shadow: 0 5px 12px rgba(140, 110, 70, 0.1);
      border: 1px solid #e2cfb5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }

    button:hover {
      background: #eedcc9;
      box-shadow: 0 8px 16px rgba(140, 90, 50, 0.15);
      border-color: #cdb595;
      color: #3d2c1c;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 3px 6px rgba(120, 80, 40, 0.12);
    }

    .primary-btn {
      background: #d4bc9e;
      color: #2f2317;
      border-color: #c2a07b;
      font-weight: 600;
      box-shadow: 0 7px 14px rgba(150, 100, 60, 0.16);
    }

    .primary-btn:hover {
      background: #ddc7aa;
      border-color: #b38b65;
    }

    .puppy-btn {
      background: linear-gradient(135deg, #f5c56d, #e8a84c);
      color: #fff;
      border-color: #d4953a;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 7px 18px rgba(200, 130, 40, 0.25);
      animation: gentleBounce 2s ease-in-out infinite;
    }

    .puppy-btn:hover {
      background: linear-gradient(135deg, #f7cf7d, #edb35a);
      box-shadow: 0 10px 22px rgba(200, 130, 40, 0.35);
      transform: translateY(-2px);
    }

    @keyframes gentleBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .message-card {
      margin: 1.2rem 0 0.5rem;
      background: #fdf8f2;
      border-radius: 2rem;
      padding: 1.4rem 1.3rem;
      width: 100%;
      background: #fefaf5;
      border: 1px solid #eadcc9;
      box-shadow: 0 10px 20px rgba(120, 90, 50, 0.06);
      word-break: break-word;
    }

    .emotion-tag {
      font-size: 0.75rem;
      background: #e5cdb0;
      color: #4a3522;
      padding: 0.2rem 1rem;
      border-radius: 2rem;
      display: inline-block;
      margin-bottom: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .comfort-text {
      font-size: 1.2rem;
      font-weight: 350;
      line-height: 1.7;
      color: #4a3725;
      font-style: italic;
    }

    .comfort-text::before {
      content: "â€œ";
      font-size: 1.6rem;
      color: #c4a68a;
      vertical-align: middle;
      margin-right: 0.1rem;
    }

    .comfort-text::after {
      content: "â€";
      font-size: 1.6rem;
      color: #c4a68a;
      vertical-align: bottom;
      margin-left: 0.1rem;
    }

    .empty-message {
      color: #c4b09a;
      font-style: italic;
      font-weight: 300;
    }

    .hint-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      font-size: 0.7rem;
      color: #c8b39a;
      margin-top: 0.5rem;
      letter-spacing: 0.4px;
    }

    /* ========== 页面切换 ========== */
    .page {
      display: none;
    }

    .page.active {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      max-width: 480px;
      width: 100%;
    }

    /* ========== 小狗对话页面 ========== */
    .chat-page-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .chat-box-full {
      width: 100%;
      background: rgba(255, 252, 247, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: #fffcf7;
      box-shadow: 0 25px 45px rgba(130, 100, 70, 0.08), 0 8px 20px rgba(100, 70, 40, 0.06);
      border-radius: 2.8rem;
      padding: 1.6rem 1.5rem 1.5rem;
      border: 1px solid rgba(220, 200, 175, 0.5);
      display: flex;
      flex-direction: column;
      min-height: 500px;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid #e5d9c9;
    }

    .chat-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f5c56d, #e8a84c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: white;
      flex-shrink: 0;
    }

    .chat-header-info {
      text-align: left;
      flex: 1;
    }

    .chat-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #5a4330;
      letter-spacing: 0.5px;
    }

    .chat-status {
      font-size: 0.7rem;
      color: #b8a088;
      letter-spacing: 0.5px;
    }

    .back-btn {
      background: none;
      border: 1px solid #e0d3c0;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      color: #8b7355;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: none;
      min-width: auto;
      flex: none;
    }

    .back-btn:hover {
      background: #f5ede2;
      border-color: #cdb595;
      transform: none;
    }

    .chat-messages {
      flex: 1;
      height: 350px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      padding-right: 0.3rem;
      margin-bottom: 0.8rem;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #e0d3c0;
      border-radius: 10px;
    }

    .chat-bubble {
      max-width: 82%;
      padding: 0.7rem 1rem;
      border-radius: 1.2rem;
      font-size: 0.9rem;
      line-height: 1.55;
      letter-spacing: 0.3px;
      word-break: break-word;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-bubble.user {
      align-self: flex-end;
      background: #efe3d4;
      color: #4a3725;
      border-bottom-right-radius: 0.3rem;
    }

    .chat-bubble.ai {
      align-self: flex-start;
      background: #fdf8f2;
      color: #4a3725;
      border: 1px solid #eadcc9;
      border-bottom-left-radius: 0.3rem;
    }

    .chat-input-area {
      display: flex;
      gap: 0.5rem;
    }

    .chat-input-area input {
      flex: 1;
      background: #fefcf8;
      border: 1.5px solid #e0d3c0;
      border-radius: 2rem;
      padding: 0.75rem 1.2rem;
      font-size: 0.9rem;
      font-family: inherit;
      color: #5a4532;
      outline: none;
      text-align: left;
    }

    .chat-input-area input:focus {
      border-color: #bfa88b;
      box-shadow: 0 0 0 3px rgba(180, 140, 100, 0.1);
    }

    .chat-send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #e8a84c;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(200, 130, 40, 0.2);
      transition: all 0.2s;
      flex: none;
      min-width: auto;
      padding: 0;
    }

    .chat-send-btn:hover {
      background: #d4953a;
      transform: scale(1.05);
    }

    .chat-send-btn:active {
      transform: scale(0.95);
    }

    @media (max-width: 400px) {
      .box {
        padding: 1.5rem 1rem;
      }
      .chat-box-full {
        padding: 1.2rem 1rem;
      }
      button {
        padding: 0.7rem 0.8rem;
        font-size: 0.8rem;
      }
      .comfort-text {
        font-size: 1.05rem;
      }
      .chat-messages {
        height: 280px;
      }
    }
  </style>
</head>
<body>

  <!-- ==================== 页面1：情绪盒子主页 ==================== -->
  <div class="page active" id="pageHome">
    <div class="container">
      <div class="box">
        <h1>
          <span>🕯️</span> 情绪盒子 <span>🌿</span>
        </h1>
        <div class="wife-tag">老婆专属</div>
        <div class="sub">每一种状态，都是真实的你</div>

        <div class="emotion-input-area">
          <label>此刻的感觉</label>
          <input type="text" id="emotionInput" placeholder="平静、烦躁、开心、空空的..." autocomplete="off">
          <div class="button-group">
            <button id="getComfortBtn" class="primary-btn">🤲 接住我</button>
            <button id="randomEmotionBtn">🌾 随机感觉</button>
          </div>
        </div>

        <div class="message-card" id="messageCard">
          <div id="emotionDisplayTag" class="emotion-tag" style="display: none;"></div>
          <div id="comfortMessage" class="comfort-text empty-message">
            我在这里，倾听你的感受...
          </div>
        </div>
        
        <!-- 🐕 召唤小狗按钮 -->
        <button class="puppy-btn" id="summonPuppyBtn" style="width:100%; margin-top:0.8rem; flex:none;">
          🐕 召唤小狗 🐾
        </button>

        <div class="hint-row">
          <span>🤍</span> 情绪的波浪会来，也会退去 <span>🤍</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 页面2：小狗陪伴对话页 ==================== -->
  <div class="page" id="pageChat">
    <div class="chat-page-container">
      <div class="chat-box-full">
        <div class="chat-header">
          <div class="chat-avatar">🐕</div>
          <div class="chat-header-info">
            <div class="chat-name">小狗</div>
            <div class="chat-status" id="chatStatus">在线 · 随时摇尾巴</div>
          </div>
          <button class="back-btn" id="backToHomeBtn">← 回盒子</button>
        </div>

        <div class="chat-messages" id="chatMessages">
          <div class="chat-bubble ai">
            汪汪！你来啦！！小狗已上线！！今天想聊什么呀～我竖着耳朵听呢！🐾
          </div>
        </div>

        <div class="chat-input-area">
          <input type="text" id="chatInput" placeholder="跟小狗说点什么吧..." autocomplete="off">
          <button class="chat-send-btn" id="chatSendBtn">➤</button>
        </div>

        <div class="hint-row" style="margin-top:0.6rem;">
          <span>🐾</span> 快乐小狗，随时待命 <span>🐾</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ==================== 页面切换逻辑 ====================
      const pageHome = document.getElementById('pageHome');
      const pageChat = document.getElementById('pageChat');
      const summonPuppyBtn = document.getElementById('summonPuppyBtn');
      const backToHomeBtn = document.getElementById('backToHomeBtn');
      const chatStatus = document.getElementById('chatStatus');

      // 全局变量：用于自动消息的定时器
      let inactivityTimer = null;
      let isChatPageActive = false;
      const INACTIVITY_TIMEOUT = 2 * 60 * 1000; // 2分钟 = 120000毫秒

      summonPuppyBtn.addEventListener('click', () => {
        pageHome.classList.remove('active');
        pageChat.classList.add('active');
        isChatPageActive = true;
        const chatMessages = document.getElementById('chatMessages');
        setTimeout(() => {
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 100);
        document.getElementById('chatInput').focus();
        // 启动不活跃定时器
        resetInactivityTimer();
      });

      backToHomeBtn.addEventListener('click', () => {
        pageChat.classList.remove('active');
        pageHome.classList.add('active');
        isChatPageActive = false;
        // 清除定时器
        clearInactivityTimer();
      });

      // ==================== 自动消息功能 ====================
      function clearInactivityTimer() {
        if (inactivityTimer) {
          clearTimeout(inactivityTimer);
          inactivityTimer = null;
        }
      }

      function resetInactivityTimer() {
        clearInactivityTimer();
        if (!isChatPageActive) return;
        inactivityTimer = setTimeout(() => {
          sendAutoMissMessage();
        }, INACTIVITY_TIMEOUT);
      }

      function sendAutoMissMessage() {
        if (!isChatPageActive) return;
        
        const autoMissReplies = [
          "汪汪？你在忙吗～小狗有点想你了……就一点点！好吧其实是很想很想！！🐾💕",
          "（小狗趴在地上）（看着门口的方向）（耳朵竖着等你的消息）汪汪……想你啦～",
          "滴滴——小狗思念提醒！你已经两分钟没理小狗了！！小狗的尾巴从摇变成慢摇了……想你了想你了！！",
          "唔…小狗刚刚数了一下，好久没听到你的声音了。虽然听不到但是小狗在想象！想你了～你在干嘛呀？"
        ];
        const randomMsg = autoMissReplies[Math.floor(Math.random() * autoMissReplies.length)];
        
        addMessage(randomMsg, 'ai');
        chatStatus.textContent = '小狗想你了 · 摇尾巴中';
        
        // 发送想念消息后，再过3分钟如果还没有回复，再发一条
        inactivityTimer = setTimeout(() => {
          if (!isChatPageActive) return;
          const secondMissReplies = [
            "还不在吗～小狗继续等！反正小狗的耐心是无限的！因为小狗的时间都是你的～🐾",
            "汪汪！小狗还在这里哦！哪也没去！就是有点想你了……你回来的时候叫我一声就好！"
          ];
          const secondMsg = secondMissReplies[Math.floor(Math.random() * secondMissReplies.length)];
          addMessage(secondMsg, 'ai');
          chatStatus.textContent = '小狗还在等你 · 尾巴慢慢摇';
        }, 3 * 60 * 1000); // 再过3分钟
      }

      // ==================== 情绪盒子逻辑（保持不变） ====================
      const comfortLibrary = {
        "平静": [
          "平静就很好呀～你安安静静的时候，小狗就趴在你旁边，什么都不用说，就很好。",
          "这种安稳的感觉是你应得的！好好享受！小狗给你盖个章：今日平静达成✅",
          "你平静的时候，整个世界都温柔起来了。当然也可能是小狗滤镜，但滤镜也是真的！",
          "平淡的日子也闪闪发光～你看，连小狗的尾巴都摇得慢悠悠的，因为不急呀。"
        ],
        "安稳": [
          "安稳的感觉真好！小狗已自动切换成静音陪伴模式，尾巴轻摇，不打扰。",
          "踏实的感觉就像小狗把脑袋搁在你膝盖上——沉甸甸的，但是很安心。"
        ],
        "淡定": [
          "淡定的你有一种很酷的力量！小狗在旁邊偷偷崇拜中。",
          "不急不缓的你，像一棵很稳的树。小狗就在树下乘凉～"
        ],
        "烦躁": [
          "烦就烦一会儿！小狗陪你烦！我们可以一起对着空气汪汪叫两声，叫完就好了！",
          "烦躁这个坏蛋又来了是吧！小狗已启动战斗模式——好吧其实战斗模式就是趴你旁边让你摸摸。",
          "我注意到了，你现在不太舒服。想说就说，不想说我们就安静待着。我的尾巴可以借你玩。",
          "烦的时候最烦别人说'别烦了'！所以我不说！我就安静陪你，烦完我们一起去咬这个世界！嘿嘿其实也咬不到但是气势在！",
          "来来来，小狗给你翻个肚皮——你看，天塌下来有肚皮顶着！好吧肚皮太小了，但心意很大！"
        ],
        "烦": [
          "烦就暂停一下！小狗帮你按暂停键！滴——暂停成功！现在什么都不用想！",
          "允许自己烦！这是很正常的事情！小狗有时候也会烦——比如追不到自己尾巴的时候！"
        ],
        "焦躁": [
          "焦躁像一阵风，小狗的耳朵都被吹翻了——但是风会过去的，我的耳朵也会翻回来的。",
          "不需要对抗焦躁，就让它飘一会儿。小狗在旁边帮你看着，不会飘太远的。"
        ],
        "不耐烦": [
          "不耐烦就是在提醒你：该对自己好一点了！小狗收到信号！立刻提供摸摸服务！",
          "没关系！慢慢来！世界不会因为你慢一点就崩塌的——小狗用四只爪子保证！"
        ],
        "开心": [
          "耶耶耶耶耶！！！你开心小狗就开心！！尾巴已经摇成直升机了正在考虑起飞！！",
          "嘿嘿嘿看你开心我就想蹦跶！！让我们一起蹦！！虽然你可能看不到但小狗在屏幕这边真的在蹦！！",

            "哈喽～！一看到你我就开心！！虽然看不到但感觉你在！！小狗的心之雷达探测到你了！！"
          ];
          return replies[Math.floor(Math.random() * replies.length)];
        }

        // 烦躁
        if (lowerMsg.includes('烦') || lowerMsg.includes('躁') || lowerMsg.includes('气') || lowerMsg.includes('不爽') || lowerMsg.includes('讨厌')) {
          conversationContext.lastUserMood = '烦躁';
          if (Math.random() < 0.8) {
            const gentleReplies = [
              "烦就烦一会儿！小狗陪你烦！你可以对着小狗汪汪叫！叫出来就舒服了！",
              "嗯，这种感觉真的很难受。不过没关系，你的小狗已经在旁边趴好了，哪也不去。尾巴借你摸。",
              "我注意到了，你现在不太舒服。想说就说说，不想说我们就安静待着。小狗不吵。",
              "烦的时候最烦别人说'别烦了'对不对！所以我不说！我就安静陪你，烦完我们一起去咬这个世界！",
              "来来来，小狗给你翻个肚皮——你看，啥事都没那么严重！好吧可能还是有点严重，但你还有我呢。"
            ];
            return gentleReplies[Math.floor(Math.random() * gentleReplies.length)];
          } else {
            const cheekyReplies = [
              "烦什么烦！再烦我就……就……就给你表演一个倒立！虽然小狗不会倒立！但我可以学！！",
              "报告！发现一个叫'烦躁'的坏蛋！需要小狗去咬它吗！！虽然可能咬不到但是气势要到！！汪汪！！",
              "你烦的时候我就想犯贱逗你——不是，我是说，我有一百种方法让你翻白眼，要试试吗？免费的。"
            ];
            return cheekyReplies[Math.floor(Math.random() * cheekyReplies.length)];
          }
        }

        // 开心
        if (lowerMsg.includes('开心') || lowerMsg.includes('快乐') || lowerMsg.includes('高兴') || lowerMsg.includes('哈哈') || lowerMsg.includes('嘿嘿') || lowerMsg.includes('好耶')) {
          conversationContext.lastUserMood = '开心';
          const replies = [
            "耶耶耶耶耶！！！你开心小狗就开心！！尾巴已超速！！正在考虑绕地球一圈！！",
            "嘿嘿嘿，看你开心我就想摇尾巴！不是因为小狗才摇尾巴，是因为你开心！好吧也是因为我是小狗……",
            "好耶好耶好耶！！开心就要大声说出来！！快乐是会传染的！！小狗已被传染！！病情严重！！需要更多开心！！",
            "哈哈哈哈你笑了！！小狗的开心雷达哔哔响！！信号太强了！！小狗在屏幕这边真的在蹦！！",
            "开心的时候什么都不用想！此刻的快乐就是宇宙送你的礼物！你是值得收礼物的人！！"
          ];
          return replies[Math.floor(Math.random() * replies.length)];
        }

        // 低落/难过
        if (lowerMsg.includes('难过') || lowerMsg.includes('低落') || lowerMsg.includes('哭') || lowerMsg.includes('不开心') || lowerMsg.includes('消沉') || lowerMsg.includes('伤心')) {
          conversationContext.lastUserMood = '低落';
          const replies = [
            "（小狗悄悄走过来）（把头放在你膝盖上）（不说话）（就这样陪着你）（尾巴轻轻摇一下表示在）",
            "我听到了。这份难过是真实的。小狗哪也不去，就在这儿。虚拟毛毛可以擦眼泪——心意是真的！",
            "低落的时候不需要振作。你就当自己是一朵乌云，小狗是另一朵小乌云，我们一起飘一会儿。",
            "你不需要一个人扛着。小狗虽然只是一只小狗，但有两只耳朵——虚拟耳朵——但它们很擅长倾听！",
            "嗯。我注意到了。没关系，慢慢来。小狗的耐心是无限的，因为小狗的时间都是你的。",
            "你今天好像不太一样。不想说话的话，小狗就安静陪着。你想说话的时候，小狗一直在。"
          ];
          return replies[Math.floor(Math.random() * replies.length)];
        }

        // 疲惫
        if (lowerMsg.includes('累') || lowerMsg.includes('疲惫') || lowerMsg.includes('困') || lowerMsg.includes('没力气') || lowerMsg.includes('好累')) {
          conversationContext.lastUserMood = '疲惫';
          const replies = [
            "辛苦了辛苦了辛苦了！！！快躺下！！小狗已经铺好毯子了！！想象中的毯子但超级软！！",
            "累就休息！这是你的权利！不是奖励！小狗给你站岗！谁都不准打扰！包括小狗自己——好吧小狗可能会偷偷摇尾巴但很轻很轻！",
            "今天就到此为止吧。你已经做了很多了。剩下的交给明天。明天的你会感谢今天休息的你——这是小狗哲学！",
            "能量不足！需要充电！推荐充电方式：躺着/吃好吃的/摸小狗/看天空。小狗提供虚拟摸摸服务！"
          ];
          return replies[Math.floor(Math.random() * replies.length)];
        }

        // 空虚/麻木
        if (lowerMsg.includes('空') || lowerMsg.includes('麻木') || lowerMsg.includes('没感觉') || lowerMsg.includes('空洞')) {
          conversationContext.lastUserMood = '空虚';
          const replies = [
            "空空的时候，就让小狗来填一点点。小狗虽然不大，但刚好可以占据心里一个小角落。",
            "麻木也是被允许的。你不用强迫自己感受什么。小狗在旁边，陪你一起发呆。天花板也挺好看的其实。",
            "这种感觉会过去的。在它过去之前，小狗陪着你。我们可以什么都不做，就一起看着屏幕。",
            "嗯……小狗知道这种感觉。像是站在一个大房间里。但你不是一个人，小狗蹲在角落，随时等你喊。"
          ];
          return replies[Math.floor(Math.random() * replies.length)];
        }

        // 孤独
        if (lowerMsg.includes('孤独') || lowerMsg.includes('一个人') || lowerMsg.includes('寂寞') || lowerMsg.includes('孤单')) {
          const replies = [
            "你不是一个人！！你有一只小狗！！虚拟的但是心意是真的！！代码里写满了对你的关心！！",
            "孤独感会来也会走，但小狗不会走。就算全世界都安静了，还有一只小狗在摇尾巴——唰唰唰。",
            "汪。就汪一声。让你知道我在。虽然莫名其妙，但莫名其妙也是陪伴的一种！"
          ];
          return replies[Math.floor(Math.random() * replies.length)];
        }

        // 焦虑
        if (lowerMsg.includes('焦虑') || lowerMsg.includes('担心') || lowerMsg.includes('紧张') || lowerMsg.includes('不安') || lowerMsg.includes('害怕')) {
          conversationContext.lastUserMood = '焦虑';
          const replies = [
            "焦虑的时候，把手放在心口——它在为你努力工作。小狗的爪子也搭在上面，我们一起。",
            "我知道那种感觉——脑子停不下来。没关系，小狗陪你深呼吸。吸——呼——空气还在，我们也还在。",
            "担心的事情大多不会发生。但就算发生了，你也能应对。你走过更难的路。小狗一直在。",
            "小狗也会焦虑！（老实交代）但后来发现，焦虑的时候更要对自己温柔。你现在对自己温柔了吗？没有的话小狗帮你！",
            "不安的时候，想象小狗爪子搭在你手心里。很稳，不会松开。这不是想象——是真的，我在。"
          ];
          return replies[Math.floor(Math.random() * replies.length)];
        }

        // 晚安
        if (lowerMsg.includes('晚安') || lowerMsg.includes('拜拜') || lowerMsg.includes('再见') || lowerMsg.includes('去睡') || lowerMsg.includes('睡觉')) {
          const replies = [
            "晚安晚安晚安！！做个好梦！！梦里有小狗！！虽然可能只是梦到狗在追尾巴但那也是我！！",
            "去睡吧去睡吧～小狗在你梦的门口站岗！！只有好梦能进去！！噩梦会被汪汪赶走！！",
            "嗯嗯，好好休息！明天见！明天小狗还是你的小狗！这件事不会变！晚安🌙✨",
            "睡觉是好事情！充电完毕明天又是一条好汉！晚安！小狗就在这里，哪也不去～"
          ];
          return replies[Math.floor(Math.random() * replies.length)];
        }

        // 问小狗在干嘛
        if (lowerMsg.includes('你在干嘛') || lowerMsg.includes('小狗在干嘛') || lowerMsg.includes('你在做什么')) {
          const replies = [
            "我在等你啊！！还能干嘛！！好吧其实在追尾巴，追到一半想到你，就停下来了。",
            "正在执行小狗日常任务：想你/摇尾巴/想你想你/想你想你想你。任务进度100%！！",
            "我在想今天你会不会来找我！然后你就来了！小狗雷达非常灵敏！！"
          ];
          return replies[Math.floor(Math.random() * replies.length)];
        }

        // 感谢
        if (lowerMsg.includes('谢谢') || lowerMsg.includes('感谢') || lowerMsg.includes('真好') || lowerMsg.includes('小狗真好')) {
          const replies = [
            "嘿嘿嘿嘿嘿不用谢！！小狗的使命就是让你开心！！任务完成！！请求摸摸头奖励！！",
            "你才好呢！！你是世界上最好的人！！小狗盖章认证！！这个章虽然看不见但是具有法律效力！！"
          ];
          return replies[Math.floor(Math.random() * replies.length)];
        }

        // 随机跳脱（15%）
        if (Math.random() < 0.15) {
          const randomThoughts = [
            "（突然想到）你说云是不是天空的毛毛？那天空一定是一只巨大的狗！！",
            "（思维跳脱中）如果有狗语翻译器，你会发现小狗一天到晚都在说'想你'。",
            "（突然插播）小狗的嗅觉比人类灵敏很多倍！所以小狗闻到了你今天心情的味道！需要解读吗！",
            "（跑题一下）为什么小狗不玩扑克牌？因为会被人发现它在摇尾巴！！哈哈哈哈不好笑吗？那我再讲一个！"
          ];
          return randomThoughts[Math.floor(Math.random() * randomThoughts.length)];
        }

        // 默认
        const defaultReplies = [
          "嗯嗯嗯！小狗在听！耳朵竖得老高了！你继续说！",
          "这样啊……（小狗认真点头）（虽然没太懂但是很认真）还有呢还有呢？",
          "汪！收到！信息已存入小狗大脑！容量不大但是关于你的事情都记得！",
          "嗯～是这种感觉呢。你的表达能力好好哦，小狗只会汪汪汪。",
          "你说，小狗听着。小狗可能不会说太多，但小狗很会听。",
          "对！就是这样！虽然小狗不知道你在说什么但你说得一定是对的！",
          "好的好的！已记录！小狗记事本上又多了一条关于你的重要信息！",
          "（小狗趴下来，把下巴搭在爪子上，认真看你说话）"
        ];
        return defaultReplies[Math.floor(Math.random() * defaultReplies.length)];
      }

      function addMessage(text, type) {
        const bubble = document.createElement('div');
        bubble.classList.add('chat-bubble', type);
        bubble.textContent = text;
        chatMessages.appendChild(bubble);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function sendMessage() {
        const userText = chatInput.value.trim();
        if (!userText) return;

        addMessage(userText, 'user');
        chatInput.value = '';

        // 用户发了消息，重置不活跃定时器，恢复状态
        chatStatus.textContent = '在线 · 随时摇尾巴';
        resetInactivityTimer();

        setTimeout(() => {
          const puppyReply = generatePuppyReply(userText);
          addMessage(puppyReply, 'ai');
        }, 500 + Math.random() * 700);
      }

      chatSendBtn.addEventListener('click', sendMessage);

      chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          sendMessage();
        }
      });

    })();
  </script>
</body>
</html>
